<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Open Grips Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#E4E8E3; --surface:#F6F7F4; --surface-2:#ECEFEA; --ink:#1C2422; --muted:#5B6662; --line:#C7CEC8;
  --accent:#0E6655; --accent-ink:#FFFFFF; --danger:#A8322A;
  --z0:#C2443A; --z1:#D27A22; --z2:#2F67AE; --z3:#2C8566; --z4:#A88A1F;
  --display:'Barlow Condensed','Arial Narrow','Roboto Condensed',sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#121715; --surface:#1B2220; --surface-2:#232B28; --ink:#E6EBE7; --muted:#9AA6A1; --line:#323C38;
    --accent:#3FB49A; --accent-ink:#0B1412; --danger:#E0675E;
    --z0:#E0665C; --z1:#E8984A; --z2:#6A9BE0; --z3:#4FB58F; --z4:#D3B648;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#121715; --surface:#1B2220; --surface-2:#232B28; --ink:#E6EBE7; --muted:#9AA6A1; --line:#323C38;
  --accent:#3FB49A; --accent-ink:#0B1412; --danger:#E0675E;
  --z0:#E0665C; --z1:#E8984A; --z2:#6A9BE0; --z3:#4FB58F; --z4:#D3B648;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); background:var(--bg); }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased; }
button,input,select{ font:inherit; color:inherit; }
button{ cursor:pointer; }
:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }

main{ max-width:560px; margin:0 auto; padding:14px 16px calc(96px + env(safe-area-inset-bottom,0px)); }
.top{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:14px; }
.brand{ font-family:var(--display); font-weight:700; font-size:22px; letter-spacing:.01em; }
.sync{ font-size:13px; color:var(--muted); }
.notice{ background:var(--surface-2); border-left:4px solid var(--z1); padding:10px 12px; border-radius:6px; font-size:14px; margin-bottom:14px; }
.notice.err{ border-left-color:var(--danger); }

h1,h2{ font-family:var(--display); font-weight:700; margin:0; line-height:1.05; }
h2{ font-size:24px; margin:22px 0 10px; }
.muted{ color:var(--muted); }
.small{ font-size:14px; }

.seg{ display:inline-flex; background:var(--surface-2); border:1px solid var(--line); border-radius:999px; padding:3px; }
.seg button{ border:0; background:transparent; padding:6px 16px; border-radius:999px; font-weight:600; font-size:15px; }
.seg button[aria-pressed="true"]{ background:var(--ink); color:var(--bg); }

/* Today */
.next{ background:var(--surface); border-radius:14px; padding:18px 18px 20px; border:1px solid var(--line); }
.next-head{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:14px; }
.zone-name{ font-family:var(--display); font-weight:700; font-size:44px; line-height:.95; }
.figs{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:16px 0 18px; }
.fig b{ display:block; font-family:var(--display); font-weight:600; font-size:38px; line-height:1; }
.fig span{ font-size:13px; color:var(--muted); }
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:12px 16px; font-weight:600; }
.btn.primary{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
.btn.block{ width:100%; font-size:18px; padding:16px; }
.btn.danger{ color:var(--danger); }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
.howto{ font-size:14px; color:var(--muted); margin:12px 0 0; }

.ladder{ display:grid; grid-template-columns:repeat(5,1fr); gap:4px; margin-top:8px; }
.rung{ border-radius:8px; padding:10px 6px 8px; background:var(--surface); border:1px solid var(--line); text-align:center; position:relative; }
.rung .bar{ height:6px; border-radius:3px; margin-bottom:8px; }
.rung .n{ font-family:var(--display); font-weight:700; font-size:26px; line-height:1; }
.rung .l{ font-size:11.5px; line-height:1.2; color:var(--muted); display:block; margin-top:4px; min-height:2.4em; }
.rung.due{ border-color:var(--ink); border-width:2px; padding:9px 5px 7px; }
.rung.due::after{ content:"Due"; position:absolute; top:-9px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg); font-size:11px; font-weight:600; padding:1px 7px; border-radius:999px; }
.trend{ margin-top:14px; display:flex; gap:10px; align-items:baseline; font-size:15px; }
.trend b{ font-family:var(--display); font-size:26px; }

/* Timer */
.timer{ position:fixed; inset:0; background:var(--bg); z-index:20; overflow-y:auto; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
.timer[hidden]{ display:none; }
.timer-inner{ max-width:480px; margin:0 auto; padding:14px 18px 28px; display:flex; flex-direction:column; min-height:100%; }
.t-head{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
.t-zone{ font-family:var(--display); font-weight:700; font-size:28px; }
.wt{ display:flex; align-items:center; gap:6px; margin-top:10px; }
.wt button{ width:44px; height:44px; border-radius:10px; border:1px solid var(--line); background:var(--surface); font-size:22px; font-weight:600; }
.wt input{ width:84px; text-align:center; font-family:var(--display); font-weight:700; font-size:30px; border:1px solid var(--line); border-radius:10px; background:var(--surface); padding:4px; }
.ring-wrap{ position:relative; width:min(78vw,300px); aspect-ratio:1; margin:22px auto 10px; }
.ring-wrap svg{ width:100%; height:100%; transform:rotate(-90deg); }
.ring-bg{ fill:none; stroke:var(--surface-2); stroke-width:14; }
.ring-fg{ fill:none; stroke-width:14; stroke-linecap:round; transition:stroke .3s; }
.ring-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.big{ font-family:var(--display); font-weight:700; font-size:min(26vw,104px); line-height:.9; font-variant-numeric:tabular-nums; }
.under{ font-size:15px; color:var(--muted); margin-top:6px; text-align:center; }
.reps{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; min-height:34px; margin:6px 0 16px; }
.chip{ border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:4px 12px; font-size:15px; }
.chip b{ font-family:var(--display); font-size:18px; }
.chip.empty{ color:var(--muted); border-style:dashed; background:transparent; }
.t-actions{ display:grid; gap:10px; margin-top:auto; }
.go{ font-size:22px; padding:22px; border-radius:14px; }
.go.hold{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
.row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

/* Log */
.form{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px; display:grid; gap:10px; margin-bottom:14px; }
.form[hidden]{ display:none; }
.form .grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.form .grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
label.f{ display:grid; gap:4px; font-size:13px; color:var(--muted); }
label.f input, label.f select{ border:1px solid var(--line); border-radius:8px; background:var(--bg); padding:9px 10px; font-size:16px; color:var(--ink); width:100%; min-width:0; }
.list{ list-style:none; margin:0; padding:0; display:grid; gap:8px; }
.item{ display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
.swatch{ width:6px; align-self:stretch; border-radius:3px; }
.item .l1{ font-weight:600; }
.item .l2{ font-size:14px; color:var(--muted); font-variant-numeric:tabular-nums; }
.del{ border:0; background:transparent; color:var(--muted); padding:8px; border-radius:8px; font-size:14px; }
.del:hover{ color:var(--danger); }
.empty-state{ background:var(--surface); border:1px dashed var(--line); border-radius:12px; padding:20px; text-align:center; color:var(--muted); }

/* Curve */
.chart{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 6px 4px; overflow-x:auto; }
.chart svg{ display:block; width:100%; height:auto; min-width:300px; }
.chart text{ fill:var(--muted); font-size:10px; font-family:var(--body); }
table{ width:100%; border-collapse:collapse; font-size:15px; }
th,td{ text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; }
th{ font-weight:600; color:var(--muted); font-size:13px; }
td.num,th.num{ text-align:right; }
.dot{ display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:8px; vertical-align:middle; }

/* Settings */
.zones-edit input{ width:100%; min-width:0; border:1px solid var(--line); border-radius:6px; background:var(--bg); padding:6px; text-align:right; font-size:15px; }

/* Tab bar */
.tabs{ position:fixed; left:0; right:0; bottom:0; background:var(--surface); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px); z-index:10; }
.tabs-inner{ max-width:560px; margin:0 auto; display:grid; grid-template-columns:repeat(5,1fr); }
.tabs button{ border:0; background:transparent; padding:12px 4px 13px; font-weight:600; font-size:15px; color:var(--muted); position:relative; }
.tabs button[aria-current="page"]{ color:var(--ink); }
.tabs button[aria-current="page"]::before{ content:""; position:absolute; top:0; left:25%; right:25%; height:3px; background:var(--accent); border-radius:0 0 3px 3px; }

:root{ --g-prometheus:#0E6655; --g-sisyphus:#9A4A22; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --g-prometheus:#3FB49A; --g-sisyphus:#E08A5A; } }
:root[data-theme="dark"]{ --g-prometheus:#3FB49A; --g-sisyphus:#E08A5A; }
body[data-gripper="prometheus"]{ --accent:var(--g-prometheus); }
body[data-gripper="sisyphus"]{ --accent:var(--g-sisyphus); }
.gswitch{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px; }
.gswitch button{ text-align:left; border:1px solid var(--line); background:var(--surface); border-radius:12px; padding:10px 12px 10px 16px; position:relative; overflow:hidden; color:var(--muted); }
.gswitch button::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--gc); opacity:.35; }
.gswitch .gn{ font-family:var(--display); font-weight:700; font-size:24px; line-height:1; display:block; }
.gswitch .gk{ font-size:13px; }
.gswitch button[aria-pressed="true"]{ color:var(--ink); border-color:var(--gc); box-shadow:0 0 0 1px var(--gc) inset; }
.gswitch button[aria-pressed="true"]::before{ opacity:1; }
.gswitch button[aria-pressed="true"] .gn{ color:var(--gc); }
.gtag{ display:inline-block; font-size:12px; font-weight:600; padding:1px 8px; border-radius:999px; border:1px solid var(--gc); color:var(--gc); margin-right:6px; vertical-align:1px; }
.next{ border-top:5px solid var(--accent); }
.filters{ display:flex; gap:6px; flex-wrap:wrap; margin:0 0 12px; }
.filters button{ border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:5px 12px; font-size:14px; font-weight:600; color:var(--muted); }
.filters button[aria-pressed="true"]{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
.steps{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

.plan-today{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:14px; }
.pt-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
.pt-head b{ font-family:var(--display); font-size:22px; }
.checks{ list-style:none; margin:0; padding:0; display:grid; gap:10px; }
.ck{ display:grid; grid-template-columns:32px 1fr; gap:12px; align-items:start; }
.box{ width:32px; height:32px; border-radius:8px; border:2px solid var(--line); background:var(--bg); display:inline-flex; align-items:center; justify-content:center; font-weight:700; color:var(--accent-ink); padding:0; }
.box.on{ background:var(--accent); border-color:var(--accent); }
.ck-l{ font-weight:600; }
.ck-d{ font-size:14px; color:var(--muted); }
.gstat{ display:inline-block; margin:2px 12px 2px 0; white-space:pre; }
.adh{ display:flex; gap:10px; align-items:baseline; margin:0 0 12px; }
.adh b{ font-family:var(--display); font-size:34px; color:var(--accent); }
.week{ list-style:none; margin:0; padding:0; display:grid; gap:6px; }
.day{ display:grid; grid-template-columns:52px 1fr; gap:12px; align-items:start; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
.day.today{ border:2px solid var(--ink); padding:9px 11px; }
.dname{ display:flex; flex-direction:column; line-height:1.1; }
.dname b{ font-family:var(--display); font-size:20px; }
.dname span{ font-size:13px; color:var(--muted); }
.dchips,.pchips{ display:flex; flex-wrap:wrap; gap:6px; }
.dchip{ font-size:14px; padding:4px 10px; border-radius:999px; background:var(--surface-2); border:1px solid var(--line); }
.dchip.on{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
.pchip{ font-size:13px; padding:5px 10px; border-radius:999px; border:1px dashed var(--line); background:transparent; color:var(--muted); font-weight:600; }
.pchip[aria-pressed="true"]{ border-style:solid; border-color:var(--ink); background:var(--ink); color:var(--bg); }
.guide{ margin:0; }
.guide dt{ font-weight:700; margin-top:12px; }
.guide dd{ margin:2px 0 0; color:var(--muted); font-size:15px; }

.linkbtn{ border:0; background:transparent; color:var(--accent); font-weight:600; font-size:14px; padding:6px 2px; text-decoration:underline; text-underline-offset:3px; }
.plan-today .linkbtn{ margin-top:10px; }
.plan-today.rest{ border-left:5px solid var(--accent); }
.prog{ display:flex; justify-content:space-between; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line); border-left:5px solid var(--accent); border-radius:12px; padding:12px 14px; margin-bottom:14px; }
.prog b{ font-family:var(--display); font-size:22px; }
.day.post{ opacity:.6; }
.wknav{ display:grid; grid-template-columns:44px 1fr 44px; gap:8px; align-items:center; text-align:center; margin-bottom:4px; }
.wknav .btn{ padding:8px; }
.wknav span{ display:flex; flex-direction:column; line-height:1.2; }

.ck-m{ font-size:14px; color:var(--muted); }
.ck-m .linkbtn{ padding:2px 0; }
button.dchip{ font:inherit; font-size:14px; color:var(--ink); cursor:pointer; }
.dchip.moved{ border-style:dashed; }

.pt-foot{ display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; margin-top:14px; padding-top:12px; border-top:1px solid var(--line); }
.reorder{ display:flex; gap:4px; margin-top:6px; }
.reorder button{ width:30px; height:30px; border-radius:8px; border:1px solid var(--line); background:var(--bg); font-weight:700; padding:0; }
.reorder button:disabled{ opacity:.35; cursor:not-allowed; }
.day .linkbtn{ margin-top:6px; }

.ask{ position:fixed; inset:0; z-index:40; background:rgba(10,14,12,.45); display:flex; align-items:flex-end; justify-content:center; padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px)); }
.ask[hidden]{ display:none; }
.ask-card{ width:100%; max-width:440px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:18px; box-shadow:0 10px 30px rgba(0,0,0,.25); }
.ask-card p{ margin:0 0 16px; font-size:17px; }
.btn.danger-fill{ background:var(--danger); border-color:var(--danger); color:#fff; }
.pairnote{ background:var(--surface-2); border-left:4px solid var(--accent); border-radius:8px; padding:10px 12px; margin:0 0 12px; }
.pairnote p{ margin:0 0 8px; font-size:15px; }
@media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>

<section class="timer" id="timer" hidden aria-label="Hold timer">
  <div class="timer-inner">
    <div class="t-head">
      <div>
        <div class="t-zone" id="tZone"></div>
        <div class="small muted" id="tSub"></div>
      </div>
      <button class="btn" data-action="t-close">Close</button>
    </div>
    <div class="wt" aria-label="Weight">
      <button data-action="wt-down" aria-label="Decrease weight">−</button>
      <input id="tWeight" inputmode="decimal" aria-label="Weight in pounds">
      <button data-action="wt-up" aria-label="Increase weight">+</button>
      <span class="muted">lbs</span>
    </div>
    <div class="ring-wrap">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <circle class="ring-bg" cx="100" cy="100" r="88"/>
        <circle class="ring-fg" id="ringFg" cx="100" cy="100" r="88"/>
      </svg>
      <div class="ring-center">
        <div class="big" id="tBig">0</div>
        <div class="under" id="tUnder"></div>
      </div>
    </div>
    <div class="reps" id="tReps"></div>
    <div class="t-actions" id="tActions"></div>
  </div>
</section>

<div class="ask" id="ask" hidden>
  <div class="ask-card" role="alertdialog" aria-modal="true" aria-labelledby="askMsg">
    <p id="askMsg"></p>
    <div class="row2"><button class="btn" id="askCancel">Cancel</button><button class="btn primary" id="askOk">OK</button></div>
  </div>
</div>

<nav class="tabs" aria-label="Sections">
  <div class="tabs-inner">
    <button data-view="today">Today</button>
    <button data-view="log">Log</button>
    <button data-view="plan">Plan</button>
    <button data-view="curve">Curve</button>
    <button data-view="settings">Settings</button>
  </div>
</nav>

<script>
(function(){
"use strict";

const GRIPPERS = [
  { id:"prometheus", name:"Prometheus", kind:"Micro", muscle:"FDP" },
  { id:"sisyphus",   name:"Sisyphus",   kind:"Crusher", muscle:"FDS" }
];
const ACTS = {
  grip:     { label:"Grippers",      desc:"Prometheus, then Sisyphus. Both hands." },
  board:    { label:"Tension board", desc:"Warm up, limit problems, then 10 min core." },
  open:     { label:"Open climbing", desc:"Gym session on whatever you like. Mix volume with a few hard tries." },
  outdoor:  { label:"Outdoor climbing", desc:"A day on real rock. Warm up well and count it as a hard climbing day." },
  strA:     { label:"Strength A",    desc:"Legs, push, core." },
  strB:     { label:"Strength B",    desc:"Pull, posterior chain, core." },
  cardio:   { label:"Easy cardio",   desc:"Zone 2 on a bike or incline walk, 30–45 min." },
  mobility: { label:"Mobility",      desc:"Easy stretching or a walk." }
};
const ACT_ORDER = ["grip","board","open","outdoor","strA","strB","cardio","mobility"];
const DEFAULT_PLAN = { "1":["grip","strA"], "2":["board"], "3":["grip","cardio"], "4":["board"], "5":["grip","strB"], "6":["board"], "0":["grip","cardio"] };
const DEFAULT_SEQ = [["grip","strA"],["board"],["grip","cardio"],["board"],["grip","strB"],["board"],["grip","cardio"]];
const DAY_NAMES = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const DEFAULT_SETTINGS = {
  zones: [
    {name:"Power", bottom:20, top:47, target:40, reps:3},
    {name:"Power/Strength", bottom:48, top:81, target:72, reps:3},
    {name:"Strength", bottom:82, top:128, target:120, reps:3},
    {name:"Strength/Endurance", bottom:129, top:179, target:160, reps:2},
    {name:"Endurance", bottom:180, top:300, target:240, reps:1}
  ],
  rest: 20,
  oneRMTime: 20,
  steps: { prometheus:1, sisyphus:1 },
  starter: { prometheus:[32,22,15,13,10], sisyphus:[90,62.5,45,35,27.5] },
  starterCount: 5,
  seq: DEFAULT_SEQ,
  program: { start:"", end:"", block:4, rest:1 }
};

function readPref(k, ok, d){ try { const v = localStorage.getItem(k); return ok.includes(v) ? v : d; } catch(e){ return d; } }
function writePref(k, v){ try { localStorage.setItem(k, v); } catch(e){} }

const state = {
  sessions: [],
  settings: clone(DEFAULT_SETTINGS),
  gripper: readPref("og-gripper", ["prometheus","sisyphus"], "prometheus"),
  hand: "LH",
  curveHand: "LH",
  logFilter: "all",
  view: "today",
  mode: "loading",
  loaded: false,
  slow: false,
  error: "",
  showForm: false,
  checks: {},
  days: [],
  carry: [],
  editPlan: false,
  weekOffset: 0,
  editProgram: false
};

let logRef = null, settingsRef = null, checksRef = null;

function clone(o){ return JSON.parse(JSON.stringify(o)); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function zoneColor(i){ return "var(--z" + i + ")"; }
function gColor(id){ return "var(--g-" + id + ")"; }
function gInfo(id){ return GRIPPERS.find(g => g.id === id) || GRIPPERS[0]; }
function gOf(s){ return s.gripper === "sisyphus" ? "sisyphus" : "prometheus"; }
function zoneIndex(name){ return state.settings.zones.findIndex(z => z.name === name); }
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fmtDate(s){ const [y,m,d]=String(s).split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}); }
function uid(){ return "s" + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function mergeSettings(d){
  const s = Object.assign(clone(DEFAULT_SETTINGS), clone(d || {}));
  s.steps = Object.assign(clone(DEFAULT_SETTINGS.steps), (d && d.steps) || {});
  s.starter = Object.assign(clone(DEFAULT_SETTINGS.starter), (d && d.starter) || {});
  if (d && d.step && !(d.steps)) { s.steps.prometheus = d.step; s.steps.sisyphus = d.step; }
  delete s.step;
  if (!d || !Array.isArray(d.seq) || !d.seq.length){
    s.seq = d && d.plan && typeof d.plan === "object"
      ? ["1","2","3","4","5","6","0"].map(k => (d.plan[k] || []).filter(a => ACTS[a]))
      : clone(DEFAULT_SEQ);
  }
  delete s.plan;
  s.program = Object.assign(clone(DEFAULT_SETTINGS.program), (d && d.program) || {});
  delete s.program.postponed; delete s.program.moved;
  return s;
}

/* ---------- Plan model (rolling) ---------- */
function dateStr(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function dayNum(ds){ const [y,m,d] = String(ds).split("-").map(Number); return Math.round(Date.UTC(y, m-1, d) / 864e5); }
function numToStr(n){ const d = new Date(n * 864e5); return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0"); }
function weekdayOf(n){ return new Date(n * 864e5).getUTCDay(); }
function shortDate(ds){ const n = dayNum(ds); return DAY_NAMES[weekdayOf(n)].slice(0,3) + " " + new Date(n*864e5).getUTCDate(); }
function prog(){ return state.settings.program || DEFAULT_SETTINGS.program; }
function seq(){ const s = state.settings.seq; return Array.isArray(s) && s.length ? s : DEFAULT_SEQ; }
function seqLen(){ return seq().length; }
function days(){ return state.days || []; }
function entryN(n){ return days().find(d => d.n === n); }
function todayEntry(){ return days().find(d => d.date === todayStr()); }
// The training-day counter: finished days are 0..len-1; the active day is the next one.
function activeN(){ const e = todayEntry(); return e ? e.n : days().length; }
function idxFor(n){
  const e = entryN(n), L = seqLen();
  if (e) return ((e.idx % L) + L) % L;
  const last = days().length ? days()[days().length - 1].idx : -1;
  return (((last + 1 + (n - days().length)) % L) + L) % L;
}
function dayLabel(n){ return "Day " + (idxFor(n) + 1); }
function programInfo(n){
  const P = prog();
  if (!P.start) return null;
  const today = todayStr();
  if (today < P.start) return { phase:"before" };
  const s0 = days().filter(d => d.date < P.start).length;
  const k = n - s0;
  if (k < 0) return null;
  const L = seqLen(), block = Math.max(1, Number(P.block) || 4), rest = Math.max(0, Number(P.rest) || 0), cyc = block + rest;
  const wk = Math.floor(k / L), pos = wk % cyc;
  return { phase: P.end && today > P.end ? "after" : "on", blockNo: Math.floor(wk / cyc) + 1, week: pos + 1, block, restWeek: pos >= block };
}
function programLabel(info){
  if (!info) return "";
  if (info.phase === "before") return "Program starts " + fmtDate(prog().start);
  const base = info.restWeek ? `Block ${info.blockNo} rest week` : `Block ${info.blockNo}, week ${info.week} of ${info.block}`;
  return info.phase === "after" ? base + ", past end date" : base;
}
function carry(){ return state.carry || []; }
function carriedOut(n){ return carry().filter(c => c.from === n && c.to !== n); }
function carriedIn(n, a){ return carry().find(c => c.to === n && c.a === a); }
function isRestWeek(n){ const i = programInfo(n); return !!(i && i.phase !== "before" && i.restWeek); }
function itemsFor(n){
  const e = entryN(n);
  if (e && Array.isArray(e.items)) return e.items.filter(a => ACTS[a]);
  let items = (seq()[idxFor(n)] || []).filter(a => ACTS[a]);
  if (isRestWeek(n)) items = items.filter(a => a === "grip");
  const out = new Set(carriedOut(n).map(c => c.a));
  items = items.filter(a => !out.has(a));
  carry().forEach(c => { if (c.to === n && ACTS[c.a] && !items.includes(c.a)) items.push(c.a); });
  return ACT_ORDER.filter(a => items.includes(a));
}
function gripStatusN(n){
  const r = {}; GRIPPERS.forEach(g => { r[g.id] = new Set(); });
  const e = entryN(n);
  if (!e && n !== activeN()) return r;
  const prev = entryN(n - 1), from = prev ? prev.date : "0000-00-00", to = e ? e.date : todayStr();
  state.sessions.forEach(s => { if (s.date > from && s.date <= to) r[gOf(s)].add(s.hand); });
  return r;
}
function isDoneN(n, a){
  if (a === "grip"){ const st = gripStatusN(n); return GRIPPERS.every(g => st[g.id].size > 0); }
  return !!(state.checks["n" + n] && state.checks["n" + n][a]);
}
function nextFreeN(n, a){
  for (let i = 1; i <= seqLen(); i++){ if (!itemsFor(n + i).includes(a)) return n + i; }
  return n + 1;
}
function postponeItem(n, a){
  const to = nextFreeN(n, a), C = clone(carry());
  const chained = C.find(c => c.to === n && c.a === a);
  if (chained) chained.to = to; else C.push({ a, from: n, to });
  state.carry = C.filter(c => c.to >= activeN() - 30);
  saveTrack(); render();
}
function moveBack(n, a){ state.carry = carry().filter(c => !(c.to === n && c.a === a)); saveTrack(); render(); }
function finishDay(){
  if (todayEntry()) return;
  const n = days().length;
  state.days = days().concat([{ n, date: todayStr(), idx: idxFor(n), items: itemsFor(n) }]);
  saveTrack(); render();
}
function undoFinish(){
  const e = todayEntry();
  if (!e || e.n !== days().length - 1) return;
  state.days = days().filter(d => d !== e); saveTrack(); render();
}
function recentStats(){
  const cutoff = numToStr(dayNum(todayStr()) - 6);
  const fin = days().filter(d => d.date >= cutoff);
  let planned = 0, done = 0;
  fin.forEach(d => itemsFor(d.n).forEach(a => { planned++; if (isDoneN(d.n, a)) done++; }));
  return { days: fin.length, planned, done };
}

/* ---------- Model ---------- */
function fit(gripper, hand){
  const pts = state.sessions
    .filter(s => gOf(s) === gripper && s.hand === hand && Number(s.weight) > 0 && s.reps && Number(s.reps[0]) > 0)
    .map(s => [Math.log(Number(s.weight)), Math.log(Number(s.reps[0]))]);
  if (pts.length < 2) return null;
  const n = pts.length;
  const mx = pts.reduce((a,p)=>a+p[0],0)/n, my = pts.reduce((a,p)=>a+p[1],0)/n;
  let sxx=0, sxy=0;
  for (const [x,y] of pts){ sxx += (x-mx)*(x-mx); sxy += (x-mx)*(y-my); }
  if (sxx === 0) return null;
  const b = sxy/sxx;
  if (!(b < 0)) return null;
  return { a: Math.exp(my - b*mx), b, n };
}
const predictTime = (f,w) => f.a * Math.pow(w, f.b);
const weightFor = (f,t) => Math.pow(t / f.a, 1 / f.b);
function stepFor(g){ return Number(state.settings.steps && state.settings.steps[g]) || 1; }
function roundStep(w, g){ const st = stepFor(g); return Math.max(st, Math.round(w/st)*st); }

// Zones rotate per gripper AND per hand, so logging one hand never changes the other hand's next session.
function zoneCounts(gripper, hand){
  const h = hand || state.hand;
  const c = state.settings.zones.map(() => 0);
  for (const s of state.sessions){ if (gOf(s) !== gripper || s.hand !== h) continue; const i = zoneIndex(s.zone); if (i >= 0) c[i]++; }
  return c;
}
function nextZoneIndex(gripper, hand){
  const c = zoneCounts(gripper, hand); let best = 0;
  c.forEach((v,i) => { if (v < c[best]) best = i; });
  return best;
}
function sortedSessions(){
  return state.sessions.slice().sort((a,b) => a.date === b.date ? (a.created||0) - (b.created||0) : (a.date < b.date ? -1 : 1));
}
function recentTrend(gripper, hand, f){
  if (!f) return null;
  const recent = sortedSessions().filter(s => gOf(s) === gripper && s.hand === hand && s.weight > 0 && s.reps && s.reps[0] > 0).slice(-5);
  if (recent.length < 2) return null;
  const avg = recent.reduce((a,s) => a + (s.reps[0] / predictTime(f, s.weight) - 1), 0) / recent.length;
  return { pct: Math.round(avg*100), n: recent.length };
}

/* ---------- Persistence ---------- */
async function saveLog(){
  const body = { sessions: state.sessions };
  if (state.mode === "db" && logRef){
    try { await logRef.set(body); state.error = ""; }
    catch(e){
      state.error = e && e.code === "quota_exceeded" ? "Storage is full. Delete some old sessions and try again." : "Couldn’t save that change. Check your connection and try again.";
      render();
    }
  } else {
    try { localStorage.setItem("og-log", JSON.stringify(body)); } catch(e){}
  }
}
async function saveSettings(){
  if (state.mode === "db" && settingsRef){
    try { await settingsRef.set(state.settings); state.error = ""; }
    catch(e){ state.error = "Couldn’t save settings. Try again."; render(); }
  } else {
    try { localStorage.setItem("og-settings", JSON.stringify(state.settings)); } catch(e){}
  }
}
function readTrack(d){
  state.checks = {}; state.days = []; state.carry = [];
  if (!d || typeof d !== "object") return;
  if (d.done && typeof d.done === "object") Object.keys(d.done).forEach(k => { if (k[0] === "n") state.checks[k] = d.done[k]; });
  if (Array.isArray(d.days)) state.days = clone(d.days).sort((a,b) => a.n - b.n);
  if (Array.isArray(d.carry)) state.carry = clone(d.carry);
}
async function saveTrack(){
  const keep = activeN() - 90;
  Object.keys(state.checks).forEach(k => { if (Number(k.slice(1)) < keep) delete state.checks[k]; });
  const body = { done: state.checks, days: state.days, carry: state.carry };
  if (state.mode === "db" && checksRef){
    try { await checksRef.set(body); }
    catch(e){ state.error = "Couldn’t save that change. Try again."; render(); }
  } else {
    try { localStorage.setItem("og-checks", JSON.stringify(body)); } catch(e){}
  }
}
function loadLocal(){
  state.mode = "local";
  try { const l = JSON.parse(localStorage.getItem("og-log") || "null"); if (l && Array.isArray(l.sessions)) state.sessions = l.sessions; } catch(e){}
  try { const s = JSON.parse(localStorage.getItem("og-settings") || "null"); if (s && Array.isArray(s.zones)) state.settings = mergeSettings(s); } catch(e){}
  try { readTrack(JSON.parse(localStorage.getItem("og-checks") || "null")); } catch(e){}
  state.loaded = true;
  render();
}
async function connect(){
  if (!window.claude || typeof window.claude.use !== "function"){ loadLocal(); return; }
  let db = null, user = null;
  try { [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]); } catch(e){}
  const id = user ? await user.id().catch(() => null) : null;
  if (!db || !id){ loadLocal(); return; }
  state.mode = "db";
  logRef = db.doc("data/users/" + id + "/log");
  settingsRef = db.doc("data/users/" + id + "/settings");
  checksRef = db.doc("data/users/" + id + "/checks");
  checksRef.onSnapshot(snap => {
    const d = snap.exists ? snap.data() : null;
    readTrack(d);
    if (!T.open) render();
  }, () => {});
  const timer = setTimeout(() => { state.slow = true; render(); }, 10000);
  logRef.onSnapshot(snap => {
    const d = snap.exists ? snap.data() : null;
    state.sessions = d && Array.isArray(d.sessions) ? clone(d.sessions) : [];
    if (!snap.metadata.fromCache){ state.slow = false; clearTimeout(timer); }
    state.loaded = true;
    if (!T.open) render();
  }, () => { clearTimeout(timer); state.loaded = true; state.error = "Your log couldn’t be loaded. Reopen the page to try again."; render(); });
  settingsRef.onSnapshot(snap => {
    const d = snap.exists ? snap.data() : null;
    state.settings = d && Array.isArray(d.zones) ? mergeSettings(d) : clone(DEFAULT_SETTINGS);
    if (!T.open) render();
  }, () => {});
}

/* ---------- Views ---------- */
function handSeg(current, action){
  return `<div class="seg" role="group" aria-label="Hand">
    ${["LH","RH"].map(h => `<button data-action="${action}" data-hand="${h}" aria-pressed="${h===current}">${h}</button>`).join("")}
  </div>`;
}
function gripperSwitch(){
  return `<div class="gswitch" role="group" aria-label="Gripper">
    ${GRIPPERS.map(g => `<button data-action="gripper" data-g="${g.id}" aria-pressed="${g.id===state.gripper}" style="--gc:${gColor(g.id)}">
      <span class="gn">${g.name}</span><span class="gk">${g.kind}, ${g.muscle}</span>
    </button>`).join("")}
  </div>`;
}

function itemActions(n, a){
  const ci = carriedIn(n, a);
  if (ci) return `<div class="ck-m">Pushed from ${dayLabel(ci.from)}. <button class="linkbtn" data-action="move-back" data-n="${n}" data-a="${a}">Move back</button></div>`;
  if (isDoneN(n, a)) return "";
  return `<div class="ck-m"><button class="linkbtn" data-action="postpone" data-n="${n}" data-a="${a}">Push to ${dayLabel(nextFreeN(n, a))}</button></div>`;
}
function planItem(n, a, interactive){
  const on = isDoneN(n, a);
  if (a === "grip"){
    const st = gripStatusN(n);
    return `<li class="ck"><span class="box${on ? " on" : ""}" aria-hidden="true">${on ? "✓" : ""}</span><div>
      <div class="ck-l">${ACTS[a].label}</div>
      <div class="ck-d">${GRIPPERS.map(g => `<span class="gstat"><span class="gtag" style="--gc:${gColor(g.id)}">${g.name}</span>${["LH","RH"].map(h => st[g.id].has(h) ? h + " ✓" : h + " –").join("  ")}</span>`).join("")}</div>
      <div class="ck-d">Ticks itself when you log a session on each gripper.</div>${interactive ? itemActions(n, a) : ""}</div></li>`;
  }
  const btn = interactive
    ? `<button class="box${on ? " on" : ""}" data-action="check" data-n="${n}" data-a="${a}" aria-pressed="${on}" aria-label="${on ? "Unmark" : "Mark"} ${ACTS[a].label} done">${on ? "✓" : ""}</button>`
    : `<span class="box${on ? " on" : ""}" aria-hidden="true">${on ? "✓" : ""}</span>`;
  return `<li class="ck">${btn}<div><div class="ck-l">${ACTS[a].label}</div><div class="ck-d">${ACTS[a].desc}</div>${interactive ? itemActions(n, a) : ""}</div></li>`;
}
function todayPlanCard(){
  const e = todayEntry(), n = activeN(), info = programInfo(n), items = itemsFor(n);
  const sub = info ? programLabel(info) : `${seqLen()}-day rotation`;
  const head = `<div class="pt-head"><b>${e ? "Finished" : "Today"}: ${dayLabel(n)}</b><span class="small muted">${esc(sub)}</span></div>`;
  const restNote = isRestWeek(n) ? `<p class="small muted" style="margin:0 0 10px">Rest week for climbing, lifting and cardio. The grippers keep going.</p>` : "";
  const outs = carriedOut(n);
  const outNote = outs.length ? `<p class="small muted" style="margin:10px 0 0">${outs.map(c => `${ACTS[c.a] ? ACTS[c.a].label : c.a} pushed to ${dayLabel(c.to)}.`).join(" ")}</p>` : "";
  const list = items.length
    ? `<ul class="checks">${items.map(a => planItem(n, a, !e)).join("")}</ul>`
    : `<p class="small muted" style="margin:0">${restNote ? "No gripper session on this day." : "Rest day in the rotation."}</p>`;
  const foot = e
    ? `<div class="pt-foot"><span class="small muted">Next time you train: ${dayLabel(n + 1)}.</span><button class="linkbtn" data-action="undo-finish">Undo</button></div>`
    : `<div class="pt-foot"><button class="btn" data-action="finish-day">Finish ${dayLabel(n)}</button><span class="small muted">Skipped a day? The plan waits until you finish this one.</span></div>`;
  return `<section class="plan-today${restNote ? " rest" : ""}" aria-label="Today’s plan">${head}${restNote}${list}${outNote}${foot}</section>`;
}

function sessionCount(g, hand){ return state.sessions.filter(s => gOf(s) === g && s.hand === hand).length; }
// Starter weights cover the first sessions on each gripper and hand; after that the fitted curve takes over.
function suggest(g, hand, zi){
  const n = sessionCount(g, hand), lim = Math.max(0, Number(state.settings.starterCount) || 0);
  const st = state.settings.starter && state.settings.starter[g], sw = st ? Number(st[zi]) || 0 : 0;
  if (n < lim && sw > 0) return { w: sw, src: "starter", left: lim - n };
  const f = fit(g, hand);
  if (f) return { w: roundStep(weightFor(f, state.settings.zones[zi].target), g), src: "curve" };
  return sw > 0 ? { w: sw, src: "starter", left: 0 } : null;
}

function viewToday(){
  const g = state.gripper, gi = gInfo(g);
  const zi = nextZoneIndex(g), z = state.settings.zones[zi];
  const f = fit(g, state.hand);
  const sg = suggest(g, state.hand, zi), w = sg ? sg.w : null;
  const oh = state.hand === "LH" ? "RH" : "LH";
  const ahead = sessionCount(g, state.hand) > sessionCount(g, oh);
  const pairNote = ahead ? `<div class="pairnote"><p>${state.hand} is a session ahead on ${gi.name}. ${oh} still has <b>${esc(state.settings.zones[nextZoneIndex(g, oh)].name)}</b> to do, so do that next to keep both hands in step.</p><button class="btn" data-action="hand" data-hand="${oh}">Switch to ${oh}</button></div>` : "";
  const counts = zoneCounts(g);
  const tr = recentTrend(g, state.hand, f);
  let trendHtml = "";
  if (tr){
    const word = tr.pct > 0 ? "above" : tr.pct < 0 ? "below" : "on";
    trendHtml = `<div class="trend"><b>${tr.pct > 0 ? "+" : ""}${tr.pct}%</b><span class="muted">Your last ${tr.n} ${gi.name} ${state.hand} holds were ${Math.abs(tr.pct)}% ${word} what this curve predicts.</span></div>`;
  }
  const other = GRIPPERS.find(x => x.id !== g);
  const oz = state.settings.zones[nextZoneIndex(other.id)], of = fit(other.id, state.hand);
  const osg = suggest(other.id, state.hand, nextZoneIndex(other.id));
  const ow = osg ? osg.w + " lbs" + (osg.src === "starter" ? " (starter)" : "") : "no curve yet";
  return `
  ${todayPlanCard()}
  ${gripperSwitch()}
  <section class="next" aria-labelledby="nz">
    <div class="next-head">
      <span class="small muted">Next ${gi.name} session</span>
      ${handSeg(state.hand, "hand")}
    </div>
    <h1 class="zone-name" id="nz" style="color:${zoneColor(zi)}">${esc(z.name)}</h1>
    <div class="figs">
      <div class="fig"><b>${w !== null ? w : "–"}</b><span>${sg && sg.src === "starter" ? "lbs, starter" : "lbs"}</span></div>
      <div class="fig"><b>${z.target}</b><span>target seconds</span></div>
      <div class="fig"><b>${z.reps}</b><span>reps max</span></div>
    </div>
    ${pairNote}
    <button class="btn ${ahead ? "" : "primary "}block" data-action="start">${ahead ? `Start ${gi.name} ${state.hand} ${esc(z.name)} anyway` : `Start ${gi.name} ${state.hand} session`}</button>
    <p class="howto">${w === null
      ? `Log at least 2 ${gi.name} ${state.hand} sessions at different weights to get a suggested weight. Until then, pick a weight you can hold for about ${z.target} s.`
      : sg.src === "starter"
        ? `Starter weight from your V5 estimate. Hold until the weight drops and rest ${state.settings.rest} s between reps. ${sg.left ? `Your curve takes over after ${sg.left} more ${gi.name} ${state.hand} session${sg.left === 1 ? "" : "s"}.` : `Log sessions at a few different weights so your curve can take over.`}`
        : `From your force curve. Hold until the weight drops. Rest ${state.settings.rest} s between reps.`}</p>
    ${trendHtml}
  </section>
  <p class="small muted" style="margin:12px 2px 0"><span class="gtag" style="--gc:${gColor(other.id)}">${other.name}</span>Next: ${esc(oz.name)}, ${ow}.</p>
  <h2>${gi.name} ${state.hand} zone balance</h2>
  <p class="small muted" style="margin:-4px 0 12px">Sessions logged in each zone on ${gi.name}, ${state.hand}. Each hand has its own rotation; the least-trained zone is due next.</p>
  <div class="ladder">
    ${state.settings.zones.map((zz,i) => `
      <div class="rung${i===zi ? " due" : ""}">
        <div class="bar" style="background:${zoneColor(i)}"></div>
        <div class="n">${counts[i]}</div>
        <span class="l">${esc(zz.name).replace("/","/&#8203;")}</span>
      </div>`).join("")}
  </div>`;
}

function viewLog(){
  const zones = state.settings.zones;
  const all = sortedSessions().reverse();
  const list = state.logFilter === "all" ? all : all.filter(s => gOf(s) === state.logFilter);
  const form = `
  <form class="form" id="addForm" ${state.showForm ? "" : "hidden"}>
    <div class="grid">
      <label class="f">Gripper<select name="gripper">${GRIPPERS.map(g => `<option value="${g.id}"${g.id===state.gripper?" selected":""}>${g.name}</option>`).join("")}</select></label>
      <label class="f">Date<input type="date" name="date" value="${todayStr()}" required></label>
    </div>
    <div class="grid">
      <label class="f">Hand<select name="hand"><option${state.hand==="LH"?" selected":""}>LH</option><option${state.hand==="RH"?" selected":""}>RH</option></select></label>
      <label class="f">Zone<select name="zone">${zones.map((z,i)=>`<option${i===nextZoneIndex(state.gripper)?" selected":""}>${esc(z.name)}</option>`).join("")}</select></label>
    </div>
    <div class="grid">
      <label class="f">Weight (lbs)<input name="weight" inputmode="decimal" required></label>
      <span></span>
    </div>
    <div class="grid3">

function viewCurve(){
  const g = state.gripper, gi = gInfo(g), hand = state.curveHand, f = fit(g, hand), zones = state.settings.zones;
  const pts = state.sessions.filter(s => gOf(s) === g && s.hand === hand && s.weight > 0 && s.reps && s.reps[0] > 0);
  const oneRM = f ? roundStep(weightFor(f, state.settings.oneRMTime), g) : null;
  const yMax = Math.ceil(Math.max(...zones.map(z => z.top), ...pts.map(p => p.reps[0])) * 1.06 / 20) * 20;
  const wMax = Math.max(20, ...pts.map(p => Number(p.weight)), oneRM || 0);
  const xMax = Math.ceil(wMax * 1.15 / 10) * 10;
  const W = 340, H = 250, L = 36, R = 10, Tp = 10, B = 30;
  const sx = w => L + (w / xMax) * (W - L - R);
  const sy = t => Tp + (1 - t / yMax) * (H - Tp - B);
  let svg = "";
  zones.forEach((z,i) => {
    const y1 = sy(Math.min(z.top, yMax)), y2 = sy(z.bottom);
    svg += `<rect x="${L}" y="${y1}" width="${W-L-R}" height="${Math.max(0,y2-y1)}" fill="${zoneColor(i)}" opacity=".14"/>`;
  });
  for (let t = 0; t <= yMax; t += (yMax > 200 ? 60 : 20)){
    svg += `<line x1="${L}" x2="${W-R}" y1="${sy(t)}" y2="${sy(t)}" stroke="var(--line)" stroke-width=".6"/><text x="${L-5}" y="${sy(t)+3}" text-anchor="end">${t}</text>`;
  }
  const xStep = xMax > 150 ? 50 : xMax > 60 ? 20 : 10;
  for (let w = 0; w <= xMax; w += xStep){
    svg += `<text x="${sx(w)}" y="${H-B+14}" text-anchor="middle">${w}</text>`;
  }
  svg += `<text x="${(L+W-R)/2}" y="${H-2}" text-anchor="middle">Weight (lbs)</text>`;
  svg += `<text x="10" y="${(Tp+H-B)/2}" text-anchor="middle" transform="rotate(-90 10 ${(Tp+H-B)/2})">Rep 1 (s)</text>`;
  if (f){
    let d = "", started = false;
    for (let i = 0; i <= 120; i++){
      const w = Math.max(0.5, xMax * i / 120), t = predictTime(f, w);
      if (t > yMax){ started = false; continue; }
      d += (started ? "L" : "M") + sx(w).toFixed(1) + " " + sy(t).toFixed(1) + " ";
      started = true;
    }
    svg += `<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>`;
  }
  pts.forEach(p => {
    const i = zoneIndex(p.zone);
    svg += `<circle cx="${sx(p.weight)}" cy="${sy(Math.min(p.reps[0], yMax))}" r="4.5" fill="${i>=0?zoneColor(i):"var(--muted)"}" stroke="var(--surface)" stroke-width="1.5"/>`;
  });
  const table = f ? `<table>
      <thead><tr><th>Zone</th><th class="num">Target</th><th class="num">Weight</th></tr></thead>
      <tbody>${zones.map((z,i)=>`<tr><td><span class="dot" style="background:${zoneColor(i)}"></span>${esc(z.name)}</td><td class="num">${z.target} s</td><td class="num">${roundStep(weightFor(f,z.target), g)} lbs</td></tr>`).join("")}
      <tr><td><b>Estimated 1RM</b> <span class="muted small">(${state.settings.oneRMTime} s hold)</span></td><td></td><td class="num"><b>${oneRM} lbs</b></td></tr></tbody>
    </table>` : `<div class="empty-state">Log at least 2 ${gi.name} ${hand} sessions at different weights to draw this curve.</div>`;
  return `
  ${gripperSwitch()}
  <div class="top" style="margin-top:4px"><h1 style="font-size:32px">${gi.name} curve</h1>${handSeg(hand, "curve-hand")}</div>
  <div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${gi.name} ${hand} force curve: rep 1 hold time against weight, with zone bands">${svg}</svg></div>
  <p class="small muted">Each dot is a ${gi.name} session’s first rep, colored by zone. The line is the fitted curve (time = a × weight<sup>b</sup>)${f ? `, from ${f.n} sessions` : ""}. Each gripper has its own curve.</p>
  <h2>Weights for each zone</h2>
  ${table}`;
}

function chipFor(n, a, tappable){
  const on = isDoneN(n, a), ci = carriedIn(n, a);

    ? `<button class="dchip moved" data-action="chip-back" data-n="${n}" data-a="${a}" aria-label="${ACTS[a].label}, pushed from ${dayLabel(ci.from)}. Tap to move back.">${label}</button>`

}

/* ---------- Timer ---------- */
const T = { open:false, phase:"ready", startAt:0, restEnd:0, reps:[], zi:0, hand:"LH", gripper:"prometheus", raf:0, buzzed:false, wake:null };
const CIRC = 2 * Math.PI * 88;
let audioCtx = null;
function beep(freq, ms){
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), gn = audioCtx.createGain();
    o.frequency.value = freq; o.connect(gn); gn.connect(audioCtx.destination);
    gn.gain.setValueAtTime(0.18, audioCtx.currentTime);
    gn.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + ms/1000);
    o.start(); o.stop(audioCtx.currentTime + ms/1000);
  } catch(e){}
}
function buzz(p){ try { navigator.vibrate && navigator.vibrate(p); } catch(e){} }
async function wakeOn(){ try { if ("wakeLock" in navigator) T.wake = await navigator.wakeLock.request("screen"); } catch(e){} }
function wakeOff(){ try { T.wake && T.wake.release(); } catch(e){} T.wake = null; }

function openTimer(){
  const g = state.gripper, zi = nextZoneIndex(g), f = fit(g, state.hand), z = state.settings.zones[zi];
  Object.assign(T, { open:true, phase:"ready", reps:[], zi, hand:state.hand, gripper:g, buzzed:false });
  const sg = suggest(g, state.hand, zi);
  document.getElementById("tWeight").value = sg ? sg.w : "";
  document.getElementById("timer").hidden = false;
  document.body.style.overflow = "hidden";
  wakeOn();
  renderTimer();
}
function closeTimer(){
  cancelAnimationFrame(T.raf); T.open = false; wakeOff();
  document.getElementById("timer").hidden = true;
  document.body.style.overflow = "";
  render();
}
function zoneT(){ return state.settings.zones[T.zi]; }
function setRing(frac, color){
  const fg = document.getElementById("ringFg");
  fg.style.strokeDasharray = CIRC;
  fg.style.strokeDashoffset = CIRC * (1 - Math.max(0, Math.min(1, frac)));
  fg.style.stroke = color;
}
function renderTimer(){
  const z = zoneT(), maxR = Number(z.reps) || 1, gi = gInfo(T.gripper);
  document.getElementById("tZone").textContent = z.name;
  document.getElementById("tZone").style.color = zoneColor(T.zi);
  document.getElementById("tSub").innerHTML = `<span class="gtag" style="--gc:${gColor(gi.id)}">${gi.name}</span>${T.hand} · target ${z.target} s · up to ${maxR} rep${maxR===1?"":"s"}`;
  const chips = [];
  for (let i = 0; i < maxR; i++){
    chips.push(T.reps[i] !== undefined ? `<span class="chip">Rep ${i+1} <b>${T.reps[i]} s</b></span>` : `<span class="chip empty">Rep ${i+1}</span>`);
  }
  document.getElementById("tReps").innerHTML = chips.join("");
  const big = document.getElementById("tBig"), under = document.getElementById("tUnder"), acts = document.getElementById("tActions");
  const canSave = T.reps.length > 0;
  if (T.phase === "ready"){
    big.textContent = "0";
    under.textContent = T.reps.length ? `Rep ${T.reps.length+1}. Load up and start when ready.` : "Load up and start when ready.";
    setRing(0, zoneColor(T.zi));
    acts.innerHTML = `<button class="btn primary go" data-action="t-start">Start rep ${T.reps.length+1}</button>
      ${canSave ? `<button class="btn" data-action="t-save">Finish and save session</button>` : ""}`;
  } else if (T.phase === "hold"){
    under.textContent = "Hold until the weight drops";
    acts.innerHTML = `<button class="btn go hold" data-action="t-drop">Weight dropped</button>`;
  } else if (T.phase === "rest"){
    acts.innerHTML = `<button class="btn go" data-action="t-skip">Start next rep now</button>
      <button class="btn" data-action="t-save">Finish and save session</button>`;
  } else if (T.phase === "done"){
    big.textContent = "✓";
    under.textContent = `${T.reps.length} rep${T.reps.length===1?"":"s"} done`;
    setRing(1, "var(--accent)");
    acts.innerHTML = `<button class="btn primary go" data-action="t-save">Save session</button>
      <button class="btn danger" data-action="t-discard">Discard session</button>`;
  }
  tick();
}
function tick(){
  cancelAnimationFrame(T.raf);
  const big = document.getElementById("tBig"), under = document.getElementById("tUnder"), z = zoneT();
  if (T.phase === "hold"){
    const el = (Date.now() - T.startAt) / 1000;
    big.textContent = Math.floor(el);
    const over = el >= z.target;
    setRing(el / z.target, over ? "var(--accent)" : zoneColor(T.zi));
    if (over && !T.buzzed){ T.buzzed = true; buzz([120,80,120]); beep(880, 160); under.textContent = "Target reached. Keep holding."; }
    T.raf = requestAnimationFrame(tick);
  } else if (T.phase === "rest"){
    const left = Math.ceil((T.restEnd - Date.now()) / 1000);
    if (left <= 0){ T.phase = "ready"; buzz(200); beep(660, 220); renderTimer(); return; }
    big.textContent = left;
    under.textContent = "Rest";
    setRing(left / (Number(state.settings.rest) || 20), "var(--muted)");
    T.raf = requestAnimationFrame(tick);
  }
}
function currentWeight(){ return Number(String(document.getElementById("tWeight").value).replace(",", ".")); }
function tStart(){
  if (!(currentWeight() > 0)){ document.getElementById("tWeight").focus(); document.getElementById("tUnder").textContent = "Enter the weight first."; return; }
  beep(520, 90);
  T.phase = "hold"; T.startAt = Date.now(); T.buzzed = false; renderTimer();
}
function tDrop(){
  const secs = Math.round((Date.now() - T.startAt) / 1000);
  T.reps.push(secs);
  const maxR = Number(zoneT().reps) || 1;
  if (T.reps.length >= maxR){ T.phase = "done"; }
  else { T.phase = "rest"; T.restEnd = Date.now() + (Number(state.settings.rest) || 20) * 1000; }
  renderTimer();
}
function tSave(){
  if (!T.reps.length) return;
  const w = currentWeight();
  if (!(w > 0)){ document.getElementById("tUnder").textContent = "Enter the weight before saving."; return; }
  state.sessions.push({ id: uid(), created: Date.now(), date: todayStr(), gripper: T.gripper, zone: zoneT().name, hand: T.hand, weight: w, reps: T.reps.slice() });
  const otherHand = T.hand === "LH" ? "RH" : "LH";
  if (sessionCount(T.gripper, otherHand) < sessionCount(T.gripper, T.hand)){ state.hand = otherHand; state.gripper = T.gripper; }
  saveLog();
  closeTimer();
}

/* ---------- In-app confirmation (the browser's own dialogs are blocked in the sandbox) ---------- */
let askFn = null, askReturn = null;
function ask(msg, okLabel, fn, danger){
  askFn = fn; askReturn = document.activeElement;
  document.getElementById("askMsg").textContent = msg;
  document.getElementById("askCancel").hidden = false;
  const ok = document.getElementById("askOk");
  ok.textContent = okLabel || "OK";
  ok.className = "btn " + (danger ? "danger-fill" : "primary");
  document.getElementById("ask").hidden = false;
  ok.focus();
}
function closeAsk(run){
  const fn = askFn; askFn = null;
  document.getElementById("ask").hidden = true;
  if (askReturn && askReturn.focus) try { askReturn.focus(); } catch(e){}
  if (run && fn) fn();
}
function notify(msg){ ask(msg, "OK", null); document.getElementById("askCancel").hidden = true; }

/* ---------- Events ---------- */
document.addEventListener("click", e => {
  if (e.target.id === "askOk"){ closeAsk(true); return; }
  if (e.target.id === "askCancel" || e.target.id === "ask"){ closeAsk(false); return; }
  const tab = e.target.closest(".tabs button");
  if (tab){ state.view = tab.dataset.view; state.showForm = false; render(); window.scrollTo(0,0); return; }
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const a = el.dataset.action;
  if (a === "gripper"){ state.gripper = el.dataset.g; writePref("og-gripper", state.gripper); render(); }
  else if (a === "hand"){ state.hand = el.dataset.hand; render(); }
  else if (a === "curve-hand"){ state.curveHand = el.dataset.hand; render(); }
  else if (a === "log-filter"){ state.logFilter = el.dataset.g; render(); }
  else if (a === "check"){
    const k = "n" + el.dataset.n, act = el.dataset.a;
    state.checks[k] = Object.assign({}, state.checks[k]);
    if (state.checks[k][act]) delete state.checks[k][act]; else state.checks[k][act] = true;
    if (!Object.keys(state.checks[k]).length) delete state.checks[k];
    saveTrack(); render();
  }
  else if (a === "plan-edit"){ state.editPlan = !state.editPlan; render(); }
  else if (a === "postpone") postponeItem(Number(el.dataset.n), el.dataset.a);
  else if (a === "move-back") moveBack(Number(el.dataset.n), el.dataset.a);
  else if (a === "chip-postpone"){
    const n = Number(el.dataset.n), act = el.dataset.a;
    ask(`Push ${ACTS[act].label} from ${dayLabel(n)} to ${dayLabel(nextFreeN(n, act))}?`, "Push", () => postponeItem(n, act));
  }
  else if (a === "chip-back"){
    const n = Number(el.dataset.n), act = el.dataset.a, ci = carriedIn(n, act);
    if (ci) ask(`Move ${ACTS[act].label} back to ${dayLabel(ci.from)}?`, "Move back", () => moveBack(n, act));
  }
  else if (a === "finish-day"){
    const n = activeN(), left = itemsFor(n).filter(x => !isDoneN(n, x));
    if (left.length) ask(`Finish ${dayLabel(n)} with ${left.map(x => ACTS[x].label).join(", ")} not done? To keep a session for later, use Push instead.`, `Finish ${dayLabel(n)}`, finishDay);
    else finishDay();
  }
  else if (a === "undo-finish") undoFinish();
  else if (a === "seq-up" || a === "seq-down"){
    const i = Number(el.dataset.i), j = a === "seq-up" ? i - 1 : i + 1, S = clone(seq());
    if (j < 0 || j >= S.length) return;
    [S[i], S[j]] = [S[j], S[i]];
    state.settings.seq = S; saveSettings(); render();
  }
  else if (a === "seq-toggle"){
    const i = Number(el.dataset.i), act = el.dataset.a, S = clone(seq()), cur = new Set(S[i] || []);
    if (cur.has(act)) cur.delete(act); else cur.add(act);
    S[i] = ACT_ORDER.filter(x => cur.has(x));
    state.settings.seq = S; saveSettings(); render();
  }
  else if (a === "seq-add"){ const S = clone(seq()); S.push([]); state.settings.seq = S; saveSettings(); render(); }
  else if (a === "seq-remove"){
    const i = Number(el.dataset.i), S = clone(seq());
    if (S.length > 1) ask(`Remove Day ${i+1} from the rotation?`, `Remove Day ${i+1}`, () => { S.splice(i, 1); state.settings.seq = S; saveSettings(); render(); }, true);
  }
  else if (a === "prog-edit"){ state.editProgram = true; render(); }
  else if (a === "prog-cancel"){ state.editProgram = false; render(); }
  else if (a === "prog-clear"){
    ask("Remove the program dates? Your rotation stays, without blocks or rest weeks.", "Remove dates", () => {
      state.settings.program = clone(DEFAULT_SETTINGS.program); state.editProgram = false; saveSettings(); render();
    }, true);
  }
  else if (a === "plan-reset") ask("Replace your rotation with the suggested 7-day rotation?", "Restore", () => { state.settings.seq = clone(DEFAULT_SEQ); saveSettings(); render(); });
  else if (a === "start") openTimer();
  else if (a === "t-close"){ if (T.reps.length && T.phase !== "done") ask("Close without saving these reps?", "Close", closeTimer, true); else closeTimer(); }
  else if (a === "t-start") tStart();
  else if (a === "t-drop") tDrop();
  else if (a === "t-skip"){ T.phase = "ready"; renderTimer(); }
  else if (a === "t-save") tSave();
  else if (a === "t-discard") ask("Discard this session?", "Discard", closeTimer, true);
  else if (a === "wt-up" || a === "wt-down"){
    const st = stepFor(T.gripper), inp = document.getElementById("tWeight");
    const v = (Number(inp.value) || 0) + (a === "wt-up" ? st : -st);
    inp.value = Math.max(0, Math.round(v * 100) / 100);
  }
  else if (a === "form-open"){ state.showForm = true; render(); }
  else if (a === "form-cancel"){ state.showForm = false; render(); }
  else if (a === "del"){
    const s = state.sessions.find(x => x.id === el.dataset.id);
    if (s) ask(`Delete the ${gInfo(gOf(s)).name} ${s.hand} ${s.zone} session from ${fmtDate(s.date)}?`, "Delete", () => {
      state.sessions = state.sessions.filter(x => x.id !== s.id); saveLog(); render();
    }, true);
  }
  else if (a === "reset-settings"){
    ask("Restore the default zones and settings? Your rotation and program stay as they are.", "Restore", () => { const S = state.settings.seq, P = state.settings.program; state.settings = clone(DEFAULT_SETTINGS); state.settings.seq = S; state.settings.program = P; saveSettings(); render(); });
  }
});
document.addEventListener("submit", e => {
  e.preventDefault();
  const fd = new FormData(e.target);
  if (e.target.id === "addForm"){
    const num = k => Number(String(fd.get(k) || "").replace(",", "."));
    const reps = ["r1","r2","r3"].map(num).filter(v => v > 0);
    if (!(num("weight") > 0) || !reps.length) return;
    const g = fd.get("gripper") === "sisyphus" ? "sisyphus" : "prometheus";
    state.sessions.push({ id: uid(), created: Date.now(), date: fd.get("date") || todayStr(), gripper: g, zone: fd.get("zone"), hand: fd.get("hand"), weight: num("weight"), reps });
    state.showForm = false; saveLog(); render();
  } else if (e.target.id === "progForm"){
    const start = fd.get("start"), end = fd.get("end") || "";
    if (!start) return;
    if (end && end < start){ notify("The end date must be after the start date."); return; }
    const P = clone(prog());
    P.start = start; P.end = end;
    P.block = Math.max(1, Math.round(Number(fd.get("block")) || 4));
    P.rest = Math.max(0, Math.round(Number(fd.get("rest")) || 0));
    delete P.moved; delete P.postponed;
    state.settings.program = P; state.editProgram = false; saveSettings(); render();
  } else if (e.target.id === "setForm"){
    const n = (k, d) => { const v = Number(String(fd.get(k)).replace(",", ".")); return v > 0 ? v : d; };
    const s = state.settings;
    s.zones = s.zones.map((z,i) => ({ name: z.name, bottom: n("b"+i, z.bottom), top: n("t"+i, z.top), target: n("g"+i, z.target), reps: Math.round(n("r"+i, z.reps)) }));
    s.rest = n("rest", s.rest); s.oneRMTime = n("onerm", s.oneRMTime);
    s.steps = {}; GRIPPERS.forEach(g => { s.steps[g.id] = n("step-" + g.id, stepFor(g.id) || 1); });
    s.starter = {}; GRIPPERS.forEach(g => { s.starter[g.id] = s.zones.map((z,i) => { const v = Number(String(fd.get("st-" + g.id + "-" + i) || "0").replace(",", ".")); return v > 0 ? v : 0; }); });
    s.starterCount = Math.max(0, Math.round(Number(fd.get("startercount")) || 0));
    saveSettings(); render();
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && !document.getElementById("ask").hidden) closeAsk(false); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && T.open) wakeOn(); });

render();
connect();
})();
</script>
</body>
